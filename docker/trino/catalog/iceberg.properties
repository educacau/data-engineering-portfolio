connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg123
iceberg.jdbc-catalog.catalog-name=iceberg

# S3 Configuration (MinIO)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.region=us-east-1

# Iceberg properties
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
iceberg.parquet.compression-codec=ZSTD
iceberg.register-table-procedure.enabled=true
iceberg.materialized-views.storage-schema=default
