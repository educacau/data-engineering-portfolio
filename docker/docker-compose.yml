version: '3.9'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  minio_data:
  nifi_conf_1:
  nifi_data_1:
  nifi_logs_1:
  nifi_conf_2:
  nifi_data_2:
  nifi_logs_2:
  nifi_conf_3:
  nifi_data_3:
  nifi_logs_3:
  nifi_registry_database:
  nifi_registry_flow_storage:
  superset_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ==========================================================================
  # Messaging Infrastructure
  # ==========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.3
    container_name: zookeeper
    hostname: zookeeper
    networks:
      - backend
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    hostname: kafka
    networks:
      - backend
      - frontend
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.3
    container_name: schema-registry
    hostname: schema-registry
    networks:
      - backend
      - frontend
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Storage Layer
  # ==========================================================================

  postgres:
    image: postgres:17.7-bookworm
    container_name: postgres
    hostname: postgres
    networks:
      - backend
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceberg123}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iceberg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    hostname: minio
    networks:
      - backend
      - frontend
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123};
      mc mb --ignore-existing myminio/warehouse;
      mc mb --ignore-existing myminio/data;
      mc mb --ignore-existing myminio/backups;
      echo 'MinIO buckets created successfully';
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    networks:
      - backend
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Data Ingestion - Apache NiFi Cluster (3 nodes)
  # ==========================================================================

  nifi-1:
    image: apache/nifi:2.7.2
    container_name: nifi-1
    hostname: nifi-1
    networks:
      - backend
      - frontend
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_HOST: nifi-1
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_CLUSTER_IS_NODE: "false"
      NIFI_SENSITIVE_PROPS_KEY: nifidemosecretkey
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:-nifi}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:-changeme123}
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-2g}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g}
    volumes:
      - nifi_conf_1:/opt/nifi/nifi-current/conf
      - nifi_data_1:/opt/nifi/nifi-current/flowfile_repository
      - nifi_logs_1:/opt/nifi/nifi-current/logs
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://nifi-1:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  nifi-2:
    image: apache/nifi:2.7.2
    container_name: nifi-2
    hostname: nifi-2
    networks:
      - backend
    ports:
      - "8444:8443"
    environment:
      NIFI_WEB_HTTPS_HOST: nifi-2
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_CLUSTER_IS_NODE: "true"
      NIFI_CLUSTER_NODE_PROTOCOL_PORT: 9998
      NIFI_CLUSTER_LOAD_BALANCE_PORT: 6342
      NIFI_ZK_CONNECT_STRING: zookeeper:2181
      NIFI_ELECTION_MAX_WAIT: 1 min
      NIFI_SENSITIVE_PROPS_KEY: nifidemosecretkey
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:-nifi}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:-changeme123}
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-2g}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g}
    volumes:
      - nifi_conf_2:/opt/nifi/nifi-current/conf
      - nifi_data_2:/opt/nifi/nifi-current/flowfile_repository
      - nifi_logs_2:/opt/nifi/nifi-current/logs
    depends_on:
      zookeeper:
        condition: service_healthy
      nifi-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://nifi-1:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    profiles:
      - full

  nifi-3:
    image: apache/nifi:2.7.2
    container_name: nifi-3
    hostname: nifi-3
    networks:
      - backend
    ports:
      - "8445:8443"
    environment:
      NIFI_WEB_HTTPS_HOST: nifi-3
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_CLUSTER_IS_NODE: "true"
      NIFI_CLUSTER_NODE_PROTOCOL_PORT: 9998
      NIFI_CLUSTER_LOAD_BALANCE_PORT: 6342
      NIFI_ZK_CONNECT_STRING: zookeeper:2181
      NIFI_ELECTION_MAX_WAIT: 1 min
      NIFI_SENSITIVE_PROPS_KEY: nifidemosecretkey
      SINGLE_USER_CREDENTIALS_USERNAME: ${SINGLE_USER_CREDENTIALS_USERNAME:-nifi}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${SINGLE_USER_CREDENTIALS_PASSWORD:-changeme123}
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-2g}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-2g}
    volumes:
      - nifi_conf_3:/opt/nifi/nifi-current/conf
      - nifi_data_3:/opt/nifi/nifi-current/flowfile_repository
      - nifi_logs_3:/opt/nifi/nifi-current/logs
    depends_on:
      zookeeper:
        condition: service_healthy
      nifi-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://nifi-1:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    profiles:
      - full

  nifi-registry:
    build:
      context: ./nifi-registry
      dockerfile: Dockerfile
    image: nifi-registry:2.7.2-postgresql
    container_name: nifi-registry
    hostname: nifi-registry
    networks:
      - backend
      - frontend
    ports:
      - "18080:18080"
    environment:
      NIFI_REGISTRY_WEB_HTTP_HOST: 0.0.0.0
      NIFI_REGISTRY_WEB_HTTP_PORT: 18080
      NIFI_REGISTRY_DB_URL: jdbc:postgresql://postgres:5432/nifi_registry
      NIFI_REGISTRY_DB_CLASS: org.postgresql.Driver
      NIFI_REGISTRY_DB_DRIVER_DIRECTORY: /opt/nifi-registry/nifi-registry-current/ext
      NIFI_REGISTRY_DB_USER: ${POSTGRES_USER:-iceberg}
      NIFI_REGISTRY_DB_PASS: ${POSTGRES_PASSWORD:-iceberg123}
      # Git configuration for flow versioning
      GIT_AUTHOR_NAME: NiFi Registry
      GIT_AUTHOR_EMAIL: nifi-registry@localhost
      GIT_COMMITTER_NAME: NiFi Registry
      GIT_COMMITTER_EMAIL: nifi-registry@localhost
    volumes:
      - nifi_registry_database:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flow_storage:/opt/nifi-registry/flow-storage
      - ./nifi-registry/conf/providers.xml:/opt/nifi-registry/nifi-registry-current/conf/providers.xml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://nifi-registry:18080/nifi-registry"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==========================================================================
  # Processing Layer - Apache Spark
  # ==========================================================================

  spark-master:
    image: bitnami/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    networks:
      - backend
      - frontend
    ports:
      - "7077:7077"
      - "8082:8080"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: spark-worker
    hostname: spark-worker
    networks:
      - backend
    ports:
      - "8083:8081"
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full

  # ==========================================================================
  # Query Layer - Trino
  # ==========================================================================

  trino:
    image: trinodb/trino:465
    container_name: trino
    hostname: trino
    networks:
      - backend
      - frontend
    ports:
      - "8080:8080"
    environment:
      TRINO_ENVIRONMENT: ${TRINO_ENVIRONMENT:-demo}
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ==========================================================================
  # Analytics Layer
  # ==========================================================================

  superset:
    image: apache/superset:4.0.2
    container_name: superset
    hostname: superset
    networks:
      - backend
      - frontend
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme_superset_secret_key}
      SUPERSET_LOAD_EXAMPLES: "no"
      DATABASE_DB: ${POSTGRES_DB:-iceberg_catalog}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-iceberg123}
      DATABASE_USER: ${POSTGRES_USER:-iceberg}
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  jupyter:
    image: jupyter/pyspark-notebook:python-3.11
    container_name: jupyter
    hostname: jupyter
    networks:
      - backend
      - frontend
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-jupyter123}
      GRANT_SUDO: "yes"
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
    depends_on:
      - trino
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Observability - Monitoring
  # ==========================================================================

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    hostname: prometheus
    networks:
      - backend
      - frontend
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    hostname: grafana
    networks:
      - backend
      - frontend
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-grafana-piechart-panel}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  # ==========================================================================
  # Observability - Logging
  # ==========================================================================

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    hostname: loki
    networks:
      - backend
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full
      - monitoring

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    hostname: promtail
    networks:
      - backend
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full
      - monitoring
