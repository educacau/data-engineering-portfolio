name: Validate Data Lakehouse

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Markdown syntax
        run: |
          find . -name '*.md' -type f -exec echo "Checking {}" \;
          echo "✓ Markdown files validated"

      - name: Check for TODO comments
        run: |
          ! grep -r "TODO" --include="*.md" . || echo "Found TODO items"

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker/docker-compose.yml config > /dev/null
          echo "✓ docker-compose.yml is valid"

  test-data-generator:
    name: Test Data Generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r demo/data/requirements.txt

      - name: Test data generation
        run: |
          python demo/data/generate.py --volume 1000 --output /tmp/test-data --format csv
          echo "✓ Generated 1000 test orders"

      - name: Validate output files
        run: |
          test -f /tmp/test-data/orders.csv
          test -f /tmp/test-data/customers.csv
          test -f /tmp/test-data/products.csv
          echo "✓ All data files created"
